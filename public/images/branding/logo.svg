<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(10, 10)">
    <!-- Camera body outer -->
    <rect x="5" y="24" width="86" height="66" rx="14" fill="#270707" stroke="#F1EBEB" stroke-width="3"/>
    <!-- Viewfinder bump -->
    <path d="M28 24 L36 12 L60 12 L68 24 Z" fill="#270707" stroke="#F1EBEB" stroke-width="3" stroke-linejoin="round"/>
    <!-- Deep Red recording/focus dot -->
    <circle cx="76" cy="38" r="4.5" fill="#660810"/>
    <!-- Lens outer ring -->
    <circle cx="48" cy="57" r="24" fill="#1E0505" stroke="#F1EBEB" stroke-width="3"/>
    <!-- Aperture blades inside lens -->
    <circle cx="48" cy="57" r="14" fill="#660810" stroke="#F1EBEB" stroke-width="1.8"/>
    <circle cx="48" cy="57" r="6" fill="#F1EBEB"/>
  </g>
  <!-- Wordmark -->
  <text x="124" y="68" font-family="'Outfit', 'Bebas Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="3" fill="#270707">ARJU VISUALS</text>
  <text x="466" y="44" font-family="'Outfit', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#660810">.CO</text>
  <text x="126" y="93" font-family="'Outfit', Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="3.2" fill="#7A6868">TURNING MOMENTS INTO TIMELESS VISUALS</text>
</svg>