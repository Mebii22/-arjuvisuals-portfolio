  <path d="M60 780 V840 H120" stroke="#F1EBEB" stroke-width="3" stroke-linecap="round"/>
  <path d="M1140 780 V840 H1080" stroke="#F1EBEB" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Subtle center grid -->
