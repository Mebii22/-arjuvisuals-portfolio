    <rect x="10" y="26" width="140" height="96" rx="18" fill="#270707" stroke="#F1EBEB" stroke-width="4"/>
    <path d="M46 26 L58 10 L102 10 L114 26 Z" fill="#270707" stroke="#F1EBEB" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="80" cy="74" r="34" fill="#1E0505" stroke="#F1EBEB" stroke-width="4"/>
    <circle cx="80" cy="74" r="18" fill="#660810" stroke="#F1EBEB" stroke-width="3"/>
    <circle cx="80" cy="74" r="7" fill="#F1EBEB"/>
    <circle cx="128" cy="46" r="6" fill="#8A2630"/>
  </g>

