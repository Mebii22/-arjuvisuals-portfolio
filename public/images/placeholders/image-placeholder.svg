  <text x="600" y="580" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="2" fill="#B8AAAA">PHOTOGRAPHIC FRAME IN PRODUCTION</text>
  <text x="600" y="615" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="1.5" fill="#7A6868">Original capture by Arjun Murali will replace this frame</text>
