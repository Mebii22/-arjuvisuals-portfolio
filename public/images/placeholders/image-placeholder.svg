  <line x1="800" y1="60" x2="800" y2="840" stroke="#660810" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <line x1="60" y1="300" x2="1140" y2="300" stroke="#660810" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#660810" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Center camera icon -->
