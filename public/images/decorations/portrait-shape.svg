<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="deepRedGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#7D0B16" />
      <stop offset="50%" stop-color="#660810" />
      <stop offset="100%" stop-color="#4A050B" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#270707" flood-opacity="0.22" />
    </filter>
  </defs>
  <!-- Organic, irregular deep-red graphic shape inspired by Reference 2 -->
  <path
    d="M 210,45 
       C 330,20 480,70 520,180 
       C 560,290 580,410 520,530 
       C 460,650 330,680 210,660 
       C 100,640 40,540 30,420 
       C 20,300 70,180 130,100 
       C 160,60 180,50 210,45 Z"
    fill="url(#deepRedGrad)"
    filter="url(#softGlow)"
  />
  <!-- Subtle interior accent curve for depth -->
  <path
    d="M 240,80 
       C 340,60 460,110 490,210 
       C 520,310 535,420 485,510 
       C 435,600 330,625 230,610"
    stroke="#8A2630"
    stroke-width="1.5"
    stroke-dasharray="8 12"
    opacity="0.35"
    fill="none"
  />
</svg>
